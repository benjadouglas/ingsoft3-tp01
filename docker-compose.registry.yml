services:
    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: plans
            POSTGRES_USER: plans
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - db_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U plans -d plans"]
            interval: 5s
            timeout: 5s
            retries: 5

    backend:
        image: ghcr.io/benjadouglas/htmlplan-backend:v0.1.0
        environment:
            PORT: 3000
            DATABASE_URL: postgres://plans@db:5432/plans
            PGPASSWORD: ${DB_PASSWORD}
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
            BETTER_AUTH_URL: http://localhost:5173
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
        ports:
            - "3000:3000"
        depends_on:
            db:
                condition: service_healthy

    frontend:
        image: ghcr.io/benjadouglas/htmlplan-frontend:v0.1.0
        ports:
            - "5173:80"
        depends_on:
            - backend

volumes:
    db_data:
