services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plans
      POSTGRES_USER: plans
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plans -d plans"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
