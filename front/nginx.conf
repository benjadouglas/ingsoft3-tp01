server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://backend:3000;

    location /api/ {
        proxy_pass $backend_api;
    }
}
