name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-back:
    runs-on: ubuntu-latest
    # Solo este job escribe paquetes: el permiso va acá y no a nivel del workflow.
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      # Corre los tests con coverage; falla si no se llega al umbral de bunfig.toml.
      - name: Tests y cobertura
        run: bun test 2>&1 | tee coverage.txt
      - name: Resumen de cobertura
        if: always()
        run: |
          echo '## Cobertura del backend' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep '|' coverage.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-back
          path: back/coverage
      - uses: docker/setup-buildx-action@v3
      # Publicar va último: si los tests fallan el job se corta antes y no se publica nada.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./back
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/benjadouglas/ingsoft3-tp01-back:sha-${{ github.sha }}
          cache-from: type=gha,scope=back
          cache-to: type=gha,mode=max,scope=back

  build-front:
    runs-on: ubuntu-latest
    # Solo este job escribe paquetes: el permiso va acá y no a nivel del workflow.
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: front/.node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      # Corre los tests con coverage; falla si no se llega a los thresholds de vite.config.ts.
      - name: Tests y cobertura
        run: bun run test --coverage 2>&1 | tee coverage.txt
      - name: Resumen de cobertura
        if: always()
        run: |
          echo '## Cobertura del frontend' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep '|' coverage.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-front
          path: front/coverage
      - uses: docker/setup-buildx-action@v3
      # Publicar va último: si los tests fallan el job se corta antes y no se publica nada.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/benjadouglas/ingsoft3-tp01-front:sha-${{ github.sha }}
          cache-from: type=gha,scope=front
          cache-to: type=gha,mode=max,scope=front
