name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-back:
    runs-on: ubuntu-latest
    # Solo este job escribe paquetes: el permiso va acá y no a nivel del workflow.
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      # Corre los tests con coverage; falla si no se llega al umbral de bunfig.toml.
      - name: Tests y cobertura
        run: bun test 2>&1 | tee coverage.txt
      - name: Resumen de cobertura
        if: always()
        run: |
          echo '## Cobertura del backend' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep '|' coverage.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-back
          path: back/coverage
      - uses: docker/setup-buildx-action@v3
      # Publicar va último: si los tests fallan el job se corta antes y no se publica nada.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./back
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/benjadouglas/htmlplan-backend:sha-${{ github.sha }}
          # Queda adentro de la imagen: /api/health dice de qué commit salió.
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=back
          cache-to: type=gha,mode=max,scope=back

  build-front:
    runs-on: ubuntu-latest
    # Solo este job escribe paquetes: el permiso va acá y no a nivel del workflow.
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: front/.node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      # Corre los tests con coverage; falla si no se llega a los thresholds de vite.config.ts.
      - name: Tests y cobertura
        run: bun run test --coverage 2>&1 | tee coverage.txt
      - name: Resumen de cobertura
        if: always()
        run: |
          echo '## Cobertura del frontend' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep '|' coverage.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-front
          path: front/coverage
      - uses: docker/setup-buildx-action@v3
      # Publicar va último: si los tests fallan el job se corta antes y no se publica nada.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/benjadouglas/htmlplan-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=front
          cache-to: type=gha,mode=max,scope=front

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-back, build-front] # sin CI verde no hay deploy
    if: github.ref == 'refs/heads/main' # los PRs verifican; solo main despliega
    environment: qa
    steps:
      # Render ya no construye: el hook le dice QUÉ IMAGEN ejecutar, la que publicó esta corrida.
      # --get --data-urlencode agrega imgURL con & (el hook ya trae ?key=) y codifica ':' y '/'.
      # La URL del hook va última: --data-urlencode se lleva el valor que tiene al lado.
      - name: Desplegar en QA la imagen del commit (back + front)
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT }}
        run: |
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=ghcr.io/benjadouglas/htmlplan-backend:sha-$GITHUB_SHA" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=ghcr.io/benjadouglas/htmlplan-frontend:sha-$GITHUB_SHA" "$HOOK_FRONT"
      # Reintenta porque el free tier tarda en bajar la imagen y en despertar.
      - name: Smoke test (espera a que QA conteste)
        shell: bash
        env:
          URL_API: ${{ vars.URL_API }}
          URL_FRONT: ${{ vars.URL_FRONT }}
        run: |
          for i in $(seq 1 30); do
            # /api/health toca la base; el último pasa por el nginx del front hasta la api.
            # Que responda no alcanza: la api tiene que decir que corre la imagen de ESTE commit.
            if [ "$(curl -fsS --max-time 10 "$URL_API/api/health" | jq -r .commit)" = "$GITHUB_SHA" ] \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/health" > /dev/null; then
              echo "QA responde (api + base + front)"; exit 0
            fi
            sleep 20
          done
          echo "QA no respondió a tiempo"; exit 1

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-qa # PROD solo después de QA vivo; el if de main se hereda por la cadena
    environment: production # acá la corrida se pausa hasta que el reviewer apruebe
    # Evita dos deploys a PROD pisándose. No ordena la cola de aprobaciones:
    # si quedan dos corridas esperando, la vieja se rechaza a mano.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # La MISMA imagen que verificó QA: el sha de esta corrida, no lo último publicado.
      - name: Desplegar en PROD la misma imagen (back + front)
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT }}
        run: |
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=ghcr.io/benjadouglas/htmlplan-backend:sha-$GITHUB_SHA" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=ghcr.io/benjadouglas/htmlplan-frontend:sha-$GITHUB_SHA" "$HOOK_FRONT"
      - name: Smoke test (espera a que PROD conteste)
        shell: bash
        env:
          URL_API: ${{ vars.URL_API }}
          URL_FRONT: ${{ vars.URL_FRONT }}
        run: |
          for i in $(seq 1 30); do
            # Que responda no alcanza: la api tiene que decir que corre la imagen de ESTE commit.
            if [ "$(curl -fsS --max-time 10 "$URL_API/api/health" | jq -r .commit)" = "$GITHUB_SHA" ] \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/health" > /dev/null; then
              echo "PROD responde (api + base + front)"; exit 0
            fi
            sleep 20
          done
          echo "PROD no respondió a tiempo"; exit 1
